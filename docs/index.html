<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGORA — Physique-Chimie</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#14233a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#132c51;color:white;padding:22px 5vw}header h1{margin:0;font-size:1.6rem}header small{color:#bed1e8}main{max-width:900px;margin:26px auto;padding:0 16px}.card{background:white;border-radius:15px;padding:24px;margin-bottom:18px;box-shadow:0 4px 18px #1d3b5c12}button,select,input{font:inherit}button{border:0;border-radius:8px;padding:12px 18px;background:#1765c1;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}input[type=text]{width:100%;padding:12px;border:1px solid #bbc9d9;border-radius:8px}label.option{display:block;padding:13px;border:1px solid #d4dfeb;border-radius:8px;margin:9px 0;cursor:pointer}label.option:has(input:checked){border-color:#1765c1;background:#eaf3ff}.muted{color:#56667b}.hidden{display:none}.feedback{background:#f2f7fe;border-left:4px solid #1765c1;padding:15px;border-radius:5px}.bar{height:9px;background:#dce6f0;border-radius:20px;overflow:hidden}.bar div{height:100%;background:#1765c1} .buttons{display:flex;gap:10px;flex-wrap:wrap}h2{margin-top:0}li{margin-bottom:7px}
</style></head><body><header><h1>AGORA <small> / PHYSIQUE-CHIMIE</small></h1><small>5 semaines · 40 questions par séance · 60 minutes conseillées</small></header><main><section id="home" class="card"><h2>Commencer une séance</h2><p>Chaque question peut comporter plusieurs bonnes réponses. Après validation, chaque proposition est expliquée.</p><label>Prénom de l’élève<input id="student" type="text" maxlength="60" placeholder="Cyril" autocomplete="given-name"></label><p><label>Semaine <select id="week"></select></label></p><p class="muted" id="weekinfo"></p><button id="start">Commencer</button></section><section id="quiz" class="card hidden"><p class="muted" id="progressText"></p><div class="bar"><div id="progressBar"></div></div><p id="timer" class="muted"></p><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback hidden"></div><div class="buttons"><button id="validate">Valider les réponses</button><button id="next" class="hidden">Question suivante</button></div></section><section id="result" class="card hidden"><h2>Rapport de séance</h2><div id="summary"></div><p id="sendStatus" class="muted"></p><div class="buttons"><button id="download">Télécharger mon rapport</button><button id="send">Envoyer le rapport au parent</button><button id="restart">Retour à l’accueil</button></div></section></main><script src="config.js"></script><script>
'use strict';let data=[],idx=0,answers=[],selected=new Set(),validated=false,started=0,student='',current=null,report=null,requestId=null;const $=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){try{const r=await fetch('questions.json');if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();let params=new URLSearchParams(location.search),n=Number(params.get('week'));data.forEach(w=>{let o=document.createElement('option');o.value=w.number;o.textContent=`Semaine ${w.number} — ${w.title}`;$('week').append(o)});if(n>=1&&n<=5)$('week').value=n;info()}catch(e){$('weekinfo').textContent='Impossible de charger les questions : '+e.message}}
function info(){let w=data.find(w=>w.number===$('week').value*1);if(w)$('weekinfo').textContent=`Séance du ${new Date(w.date+'T12:00:00').toLocaleDateString('fr-FR')} · ${w.questions.length} questions`}
$('week').onchange=info;$('start').onclick=()=>{student=$('student').value.trim();if(!student){alert('Indique le prénom de l’élève.');return}current=data.find(w=>w.number===Number($('week').value));if(!current)return;idx=0;answers=[];requestId=null;started=Date.now();$('home').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};
function render(){const q=current.questions[idx];selected=new Set();validated=false;$('question').textContent=q.q;$('progressText').textContent=`Question ${idx+1} / ${current.questions.length} · ${q.topic}`;$('progressBar').style.width=(idx/current.questions.length*100)+'%';$('options').innerHTML='';q.options.forEach((o,i)=>{let label=document.createElement('label');label.className='option';let input=document.createElement('input');input.type='checkbox';input.onchange=()=>input.checked?selected.add(i):selected.delete(i);label.append(input,document.createTextNode(' '+String.fromCharCode(65+i)+'. '+o.text));$('options').append(label)});$('feedback').classList.add('hidden');$('validate').classList.remove('hidden');$('next').classList.add('hidden');$('timer').textContent='Temps écoulé : '+Math.floor((Date.now()-started)/60000)+' min'}
$('validate').onclick=()=>{if(validated||selected.size===0){if(!validated)alert('Sélectionne au moins une réponse.');return}validated=true;let q=current.questions[idx],ok=q.options.every((o,i)=>o.ok===selected.has(i));answers.push({question:q.q,topic:q.topic,selected:[...selected].map(i=>String.fromCharCode(65+i)),correct:q.options.map((o,i)=>o.ok?String.fromCharCode(65+i):null).filter(Boolean),ok,details:q.options.map((o,i)=>({letter:String.fromCharCode(65+i),text:o.text,correct:o.ok,explanation:o.why}))});$('options').querySelectorAll('input').forEach(i=>i.disabled=true);$('feedback').innerHTML='<strong>'+(ok?'Bonne réponse !':'Réponse à revoir')+'</strong>'+q.options.map((o,i)=>`<p><strong>${String.fromCharCode(65+i)} — ${o.ok?'VRAI':'FAUX'}</strong> : ${escapeHtml(o.why)}</p>`).join('');$('feedback').classList.remove('hidden');$('validate').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=idx===current.questions.length-1?'Terminer la séance':'Question suivante'};
$('next').onclick=()=>{if(++idx===current.questions.length)finish();else render()};
function finish(){let durationSeconds=Math.round((Date.now()-started)/1000),score=answers.filter(a=>a.ok).length;report={student,week:current.number,title:current.title,date:new Date().toISOString(),score,total:answers.length,durationSeconds,answers};$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('summary').innerHTML=`<p><strong>${escapeHtml(student)}</strong> — ${escapeHtml(current.title)}</p><h2>${score} / ${answers.length}</h2><p>Durée : ${Math.floor(durationSeconds/60)} min ${durationSeconds%60} s</p><p>Une question est réussie seulement si toutes les bonnes réponses, et aucune mauvaise, ont été sélectionnées.</p>`;$('sendStatus').textContent='Envoi automatique du rapport en cours…';
$('send').click();
}
$('download').onclick=()=>{if(!report)return;let text=`AGORA PHYSIQUE-CHIMIE\n${report.student} — Semaine ${report.week}: ${report.title}\nScore ${report.score}/${report.total}\nDurée ${report.durationSeconds} secondes\n\n`+report.answers.map((a,i)=>`${i+1}. ${a.question}\nChoix : ${a.selected.join(', ')} | Attendu : ${a.correct.join(', ')} | ${a.ok?'JUSTE':'À REVOIR'}\n`+a.details.map(d=>`${d.letter}. ${d.text} — ${d.correct?'VRAI':'FAUX'} : ${d.explanation}`).join('\n')).join('\n\n');let blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`agora-physique-semaine-${report.week}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('send').onclick=()=>{if(!report)return;const url=window.AGORA_SCRIPT_URL;if(!url||!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)){$('sendStatus').textContent='Envoi non configuré : renseigner config.js.';return}let btn=$('send');btn.disabled=true;$('sendStatus').textContent='Transmission en cours…';let frame=document.createElement('iframe');frame.name='agora_reply_'+Date.now();frame.style.display='none';document.body.append(frame);let form=document.createElement('form');form.method='POST';form.action=url;form.target=frame.name;form.style.display='none';let input=document.createElement('input');input.name='payload';input.value=JSON.stringify({...report,requestId:requestId||(requestId=crypto.randomUUID())});form.append(input);document.body.append(form);form.submit();form.remove();$('sendStatus').textContent='Envoi soumis. Consultez le rapport dans Google Sheets ou votre messagerie pour confirmer sa réception.';setTimeout(()=>{frame.remove();btn.disabled=false},5000)};
$('restart').onclick=()=>{$('result').classList.add('hidden');$('home').classList.remove('hidden')};init();
</script></body></html>
